<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragonfire Builder</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #141414;
            color: #c8c8c8;
            padding: 20px;
            min-height: 100vh;
        }
        .container { max-width: 1480px; margin: 0 auto; }
        header { margin-bottom: 24px; border-bottom: 1px solid #2a2a2a; padding-bottom: 12px; }
        h1 { font-size: 1.2em; color: #d0d0d0; font-weight: normal; }
        .setup-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 24px;
        }
        .team-panel {
            background: #1a1a1a;
            border: 1px solid #2e2e2e;
            padding: 16px;
        }
        .team-panel h2 { color: #b0b0b0; margin-bottom: 14px; font-size: 1em; font-weight: normal; }
        .slot-row {
            display: grid;
            grid-template-columns: 110px minmax(0, 1fr) 72px 56px 64px;
            gap: 6px;
            align-items: center;
            margin-bottom: 10px;
        }
        .slot-row.troop-row { grid-template-columns: 110px minmax(0, 1fr); }
        .slot-row label { font-size: 0.8em; color: #8a8a8a; }
        select, input[type="text"] {
            width: 100%;
            padding: 7px;
            background: #111;
            border: 1px solid #333;
            color: #c8c8c8;
            font-size: 0.8em;
        }
        button {
            padding: 8px 14px;
            background: #222;
            border: 1px solid #444;
            color: #c8c8c8;
            cursor: pointer;
        }
        button:hover:not(:disabled) { background: #2c2c2c; }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        .team-save {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto auto auto;
            gap: 6px;
            margin-top: 12px;
        }
        .team-save-status {
            margin-top: 8px;
            font-size: 0.8em;
            color: #8a8a8a;
            min-height: 1.2em;
        }
        .start-section { text-align: center; margin-bottom: 16px; }
        .start-section label { font-size: 12px; color: #8a8a8a; margin-right: 8px; }
        .start-section select { margin-right: 16px; width: auto; }
        .battle-section {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            gap: 16px;
        }
        .team-status {
            background: #1a1a1a;
            border: 1px solid #2e2e2e;
            padding: 16px;
            max-height: 600px;
            overflow-y: auto;
        }
        .team-status h3 { color: #b0b0b0; margin-bottom: 12px; font-size: 0.95em; font-weight: normal; }
        .character-status {
            background: #151515;
            border-left: 2px solid #3a3a3a;
            padding: 8px 10px;
            margin-bottom: 8px;
        }
        .character-status.dead { opacity: 0.45; }
        .character-status .name { margin-bottom: 4px; font-size: 0.9em; }
        .character-status .health { font-size: 0.8em; color: #8a8a8a; margin-bottom: 4px; }
        .character-status .bar { height: 4px; background: #555; }
        #battleLog {
            background: #111;
            border: 1px solid #2e2e2e;
            padding: 12px;
            font-family: Consolas, monospace;
            font-size: 0.8em;
            line-height: 1.5;
            max-height: 600px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            color: #b8b8b8;
        }
        .controls { display: flex; gap: 10px; justify-content: center; margin-top: 16px; }
        #error { color: #b07070; min-height: 1.2em; margin-bottom: 12px; font-size: 0.85em; }
        @media (max-width: 1100px) {
            .battle-section, .setup-section { grid-template-columns: 1fr; }
            .slot-row { grid-template-columns: 90px 1fr 64px 52px 60px; }
            .team-save { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Dragonfire Builder</h1>
        </header>
        <div id="error"></div>
        <div class="setup-section">
            <div class="team-panel">
                <h2>Time A</h2>
                <div class="slot-row troop-row">
                    <label for="teamA-troop">Tropa</label>
                    <select id="teamA-troop"></select>
                </div>
                <div class="slot-row">
                    <label for="teamA-slot-0">Left Flank</label>
                    <select id="teamA-slot-0"></select>
                    <select id="teamA-level-0" title="Dragon Lvl"></select>
                    <select id="teamA-stars-0" title="Estrelas"></select>
                    <select id="teamA-habit-0" title="Habit Lvl"></select>
                </div>
                <div class="slot-row">
                    <label for="teamA-slot-1">Vanguard</label>
                    <select id="teamA-slot-1"></select>
                    <select id="teamA-level-1" title="Dragon Lvl"></select>
                    <select id="teamA-stars-1" title="Estrelas"></select>
                    <select id="teamA-habit-1" title="Habit Lvl"></select>
                </div>
                <div class="slot-row">
                    <label for="teamA-slot-2">Right Flank</label>
                    <select id="teamA-slot-2"></select>
                    <select id="teamA-level-2" title="Dragon Lvl"></select>
                    <select id="teamA-stars-2" title="Estrelas"></select>
                    <select id="teamA-habit-2" title="Habit Lvl"></select>
                </div>
                <div class="team-save">
                    <select id="teamA-saved"></select>
                    <input id="teamA-name" type="text" placeholder="Nome do time" />
                    <button type="button" onclick="dfbSaveTeam('teamA')">Salvar</button>
                    <button type="button" onclick="dfbLoadTeam('teamA')">Carregar</button>
                    <button type="button" onclick="dfbDeleteTeam('teamA')">Apagar</button>
                </div>
                <div id="teamA-save-status" class="team-save-status">Escreva um nome e clique Salvar.</div>
            </div>
            <div class="team-panel">
                <h2>Time B</h2>
                <div class="slot-row troop-row">
                    <label for="teamB-troop">Tropa</label>
                    <select id="teamB-troop"></select>
                </div>
                <div class="slot-row">
                    <label for="teamB-slot-0">Left Flank</label>
                    <select id="teamB-slot-0"></select>
                    <select id="teamB-level-0" title="Dragon Lvl"></select>
                    <select id="teamB-stars-0" title="Estrelas"></select>
                    <select id="teamB-habit-0" title="Habit Lvl"></select>
                </div>
                <div class="slot-row">
                    <label for="teamB-slot-1">Vanguard</label>
                    <select id="teamB-slot-1"></select>
                    <select id="teamB-level-1" title="Dragon Lvl"></select>
                    <select id="teamB-stars-1" title="Estrelas"></select>
                    <select id="teamB-habit-1" title="Habit Lvl"></select>
                </div>
                <div class="slot-row">
                    <label for="teamB-slot-2">Right Flank</label>
                    <select id="teamB-slot-2"></select>
                    <select id="teamB-level-2" title="Dragon Lvl"></select>
                    <select id="teamB-stars-2" title="Estrelas"></select>
                    <select id="teamB-habit-2" title="Habit Lvl"></select>
                </div>
                <div class="team-save">
                    <select id="teamB-saved"></select>
                    <input id="teamB-name" type="text" placeholder="Nome do time" />
                    <button type="button" onclick="dfbSaveTeam('teamB')">Salvar</button>
                    <button type="button" onclick="dfbLoadTeam('teamB')">Carregar</button>
                    <button type="button" onclick="dfbDeleteTeam('teamB')">Apagar</button>
                </div>
                <div id="teamB-save-status" class="team-save-status">Escreva um nome e clique Salvar.</div>
            </div>
        </div>
        <div class="start-section">
            <label for="defending-team">Defending</label>
            <select id="defending-team">
                <option value="1">Team B</option>
                <option value="0">Team A</option>
            </select>
            <button id="btnStartBattle" disabled>Iniciar</button>
        </div>
        <div class="battle-section">
            <div class="team-status">
                <h3>Time A</h3>
                <div id="teamAStatus"></div>
            </div>
            <div>
                <div id="battleLog">Monte a formação. Tropa do time liga Affinity (+20%) só nos dragões que têm essa tropa.</div>
                <div class="controls">
                    <button id="btnNextRound" disabled>Próxima rodada</button>
                    <button id="btnReset" disabled>Reiniciar</button>
                </div>
            </div>
            <div class="team-status">
                <h3>Time B</h3>
                <div id="teamBStatus"></div>
            </div>
        </div>
    </div>
    <script>
    (function () {
      var KEY = 'dfb-team-library';
      function val(id) {
        var el = document.getElementById(id);
        return el ? el.value : '';
      }
      function setVal(id, value) {
        var el = document.getElementById(id);
        if (el) el.value = value == null ? '' : String(value);
      }
      function selectedName(id) {
        var el = document.getElementById(id);
        if (!el || el.selectedIndex < 0) return '';
        var opt = el.options[el.selectedIndex];
        if (!opt || !opt.value) return '';
        return opt.textContent.split(' (')[0];
      }
      function describe(prefix) {
        var troop = selectedName(prefix + '-troop') || 'sem tropa';
        var dragons = [0, 1, 2].map(function (slot) {
          return selectedName(prefix + '-slot-' + slot) || '—';
        }).join(', ');
        return troop + ' · ' + dragons;
      }
      function status(prefix, text, bad) {
        var box = document.getElementById(prefix + '-save-status');
        if (!box) return;
        box.textContent = text;
        box.style.color = bad ? '#b07070' : '#9bbb7a';
      }
      function readLib() {
        try {
          var raw = localStorage.getItem(KEY);
          var data = raw ? JSON.parse(raw) : {};
          return data && typeof data === 'object' ? data : {};
        } catch (e) {
          return {};
        }
      }
      function writeLib(data) {
        localStorage.setItem(KEY, JSON.stringify(data));
      }
      function names() {
        return Object.keys(readLib()).sort(function (a, b) { return a.localeCompare(b); });
      }
      function snapshot(prefix) {
        return {
          troop: val(prefix + '-troop'),
          slots: [0, 1, 2].map(function (slot) {
            return {
              id: val(prefix + '-slot-' + slot),
              level: val(prefix + '-level-' + slot),
              stars: val(prefix + '-stars-' + slot),
              habit: val(prefix + '-habit-' + slot)
            };
          })
        };
      }
      function apply(prefix, data) {
        if (!data) return;
        setVal(prefix + '-troop', data.troop || '');
        (data.slots || []).forEach(function (slot, index) {
          setVal(prefix + '-slot-' + index, slot.id || '');
          setVal(prefix + '-level-' + index, slot.level || '');
          setVal(prefix + '-stars-' + index, slot.stars || '');
          setVal(prefix + '-habit-' + index, slot.habit || '');
        });
        var first = document.getElementById(prefix + '-slot-0');
        if (first) first.dispatchEvent(new Event('change'));
      }
      function refresh(selectedA, selectedB) {
        ['teamA', 'teamB'].forEach(function (prefix) {
          var select = document.getElementById(prefix + '-saved');
          if (!select) return;
          var keep = prefix === 'teamA' ? selectedA : selectedB;
          select.innerHTML = '<option value="">—</option>';
          names().forEach(function (name) {
            var opt = document.createElement('option');
            opt.value = name;
            opt.textContent = name;
            select.appendChild(opt);
          });
          if (keep) select.value = keep;
        });
      }
      function pickName(prefix) {
        return (val(prefix + '-name') || '').trim() || val(prefix + '-saved');
      }
      window.dfbSaveTeam = function (prefix) {
        try {
          var name = pickName(prefix);
          if (!name) {
            name = prefix === 'teamA' ? 'Time A' : 'Time B';
            var n = 1;
            var existing = readLib();
            while (existing[name + ' ' + n]) n += 1;
            name = name + ' ' + n;
            setVal(prefix + '-name', name);
          }
          var lib = readLib();
          lib[name] = snapshot(prefix);
          writeLib(lib);
          refresh(name, name);
          status(prefix, 'Salvou "' + name + '": ' + describe(prefix));
        } catch (err) {
          status(prefix, 'Erro ao salvar: ' + err.message, true);
        }
      };
      window.dfbLoadTeam = function (prefix) {
        try {
          var name = pickName(prefix);
          var lib = readLib();
          if (!name || !lib[name]) {
            status(prefix, 'Escolha um time na lista ou digite o nome.', true);
            return;
          }
          apply(prefix, lib[name]);
          setVal(prefix + '-name', name);
          refresh(prefix === 'teamA' ? name : val('teamA-saved'), prefix === 'teamB' ? name : val('teamB-saved'));
          status(prefix, 'Carregou "' + name + '": ' + describe(prefix));
        } catch (err) {
          status(prefix, 'Erro ao carregar: ' + err.message, true);
        }
      };
      window.dfbDeleteTeam = function (prefix) {
        try {
          var name = pickName(prefix);
          var lib = readLib();
          if (!name || !lib[name]) {
            status(prefix, 'Escolha o time para apagar.', true);
            return;
          }
          delete lib[name];
          writeLib(lib);
          setVal(prefix + '-name', '');
          refresh();
          status(prefix, 'Apagou "' + name + '".');
        } catch (err) {
          status(prefix, 'Erro ao apagar: ' + err.message, true);
        }
      };
      window.addEventListener('DOMContentLoaded', function () {
        refresh();
        ['teamA', 'teamB'].forEach(function (prefix) {
          var select = document.getElementById(prefix + '-saved');
          if (!select) return;
          select.addEventListener('change', function () {
            if (select.value) {
              setVal(prefix + '-name', select.value);
              window.dfbLoadTeam(prefix);
            }
          });
        });
      });
    })();
    </script>
    <script type="module" src="./main.js"></script>
</body>
</html>
